name: Publish container images

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: metricove-ghcr-release-publish
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release source and CI
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate stable SemVer tag and changelog heading
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable vMAJOR.MINOR.PATCH SemVer (received: $tag)." >&2
            exit 1
          fi
          version="${tag#v}"
          if ! grep -Fq "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md must contain a dated heading for $version." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm release commit is reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release commit must be on main." >&2
            exit 1
          fi

      - name: Require successful main-branch CI for this exact commit
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            const workflows = ["quality-gates.yml", "compose-build.yml"];
            for (const workflow_id of workflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                branch: "main",
                event: "push",
                head_sha: process.env.RELEASE_SHA,
                per_page: 100,
              });
              const runs = data.workflow_runs
                .filter((run) => run.head_sha === process.env.RELEASE_SHA
                  && run.head_branch === "main"
                  && run.event === "push")
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              const latest = runs[0];
              if (!latest) {
                throw new Error(`No main push run for ${workflow_id} exists on ${process.env.RELEASE_SHA}.`);
              }
              if (latest.status !== "completed" || latest.conclusion !== "success") {
                throw new Error(`${workflow_id} run ${latest.html_url} is ${latest.status}/${latest.conclusion ?? "pending"}.`);
              }
              core.info(`${workflow_id} run ${latest.run_number} succeeded for ${process.env.RELEASE_SHA}.`);
            }

  publish:
    name: Publish API, web and gateway images
    needs: validate-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing version tags and support safe retries
        id: registry
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        with:
          script: |
            const imageNames = ["api", "web", "gateway"];
            for (const image of imageNames) {
              let versions;
              try {
                versions = await github.paginate(
                  "GET /user/packages/{package_type}/{package_name}/versions",
                  {
                    package_type: "container",
                    package_name: `${context.repo.repo}/${image}`,
                    per_page: 100,
                  },
                );
              } catch (error) {
                if (error.status === 404) {
                  core.setOutput(`${image}_exists`, "false");
                  continue;
                }
                throw error;
              }
              if (versions.some((item) => !Array.isArray(item.metadata?.container?.tags))) {
                throw new Error(`GitHub did not return container tags for ${image}; refusing to overwrite an image.`);
              }
              const match = versions.find((item) => item.metadata.container.tags.includes(process.env.VERSION));
              if (!match) {
                core.setOutput(`${image}_exists`, "false");
                continue;
              }
              if (!/^sha256:[a-f0-9]{64}$/.test(match.name)) {
                throw new Error(`GitHub returned an unexpected manifest digest for ${image}:${process.env.VERSION}.`);
              }
              core.setOutput(`${image}_exists`, "true");
              core.setOutput(`${image}_digest`, match.name);
            }

      - name: Verify existing image tags before retrying a partial publish
        id: registry-check
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          API_EXISTS: ${{ steps.registry.outputs.api_exists }}
          WEB_EXISTS: ${{ steps.registry.outputs.web_exists }}
          GATEWAY_EXISTS: ${{ steps.registry.outputs.gateway_exists }}
          API_DIGEST: ${{ steps.registry.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.registry.outputs.web_digest }}
          GATEWAY_DIGEST: ${{ steps.registry.outputs.gateway_digest }}
        run: |
          set -euo pipefail
          for image in api web gateway; do
            case "$image" in
              api) exists="$API_EXISTS"; digest="$API_DIGEST" ;;
              web) exists="$WEB_EXISTS"; digest="$WEB_DIGEST" ;;
              gateway) exists="$GATEWAY_EXISTS"; digest="$GATEWAY_DIGEST" ;;
            esac
            image_ref="ghcr.io/${GITHUB_REPOSITORY}/${image}:${VERSION}"
            if [[ "$exists" == "true" ]]; then
              for platform in linux/amd64 linux/arm64; do
                docker pull --platform "$platform" "$image_ref" >/dev/null
                actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")"
                actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
                if [[ "$actual_version" != "$VERSION" || "$actual_revision" != "$RELEASE_SHA" ]]; then
                  echo "$image_ref already points to a different release; version tags are never overwritten." >&2
                  exit 1
                fi
              done
              echo "${image}_exists=true" >> "$GITHUB_OUTPUT"
              echo "${image}_digest=$digest" >> "$GITHUB_OUTPUT"
              echo "$image_ref already contains the same version and source commit; keeping its digest."
            else
              echo "${image}_exists=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and publish API image
        id: build_api
        if: steps.registry-check.outputs.api_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ needs.validate-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web image
        id: build_web
        if: steps.registry-check.outputs.web_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ needs.validate-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and publish gateway image
        id: build_gateway
        if: steps.registry-check.outputs.gateway_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/gateway/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:${{ needs.validate-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Record immutable image digests in the GitHub Release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          API_DIGEST: ${{ steps.build_api.outputs.digest || steps.registry-check.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest || steps.registry-check.outputs.web_digest }}
          GATEWAY_DIGEST: ${{ steps.build_gateway.outputs.digest || steps.registry-check.outputs.gateway_digest }}
        with:
          script: |
            const version = process.env.VERSION;
            const images = [
              ["API", `ghcr.io/${context.repo.owner}/${context.repo.repo}/api:${version}@${process.env.API_DIGEST}`],
              ["Web", `ghcr.io/${context.repo.owner}/${context.repo.repo}/web:${version}@${process.env.WEB_DIGEST}`],
              ["Gateway", `ghcr.io/${context.repo.owner}/${context.repo.repo}/gateway:${version}@${process.env.GATEWAY_DIGEST}`],
            ];
            for (const [name, reference] of images) {
              if (!reference.match(/@sha256:[a-f0-9]{64}$/)) {
                throw new Error(`Missing immutable digest for ${name}.`);
              }
            }
            const start = "<!-- metricove-image-digests:start -->";
            const end = "<!-- metricove-image-digests:end -->";
            const section = [
              start,
              "## Container image digests",
              "",
              "These multi-architecture image references are pinned to immutable OCI manifest digests:",
              "",
              "| Image | Versioned reference |",
              "| --- | --- |",
              ...images.map(([name, reference]) => `| ${name} | \`${reference}\` |`),
              end,
            ].join("\n");
            const body = context.payload.release.body ?? "";
            const marker = new RegExp(`${start}[\\s\\S]*?${end}`);
            const updatedBody = marker.test(body)
              ? body.replace(marker, section)
              : `${body.trimEnd()}\n\n${section}\n`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: updatedBody,
            });
            await core.summary.addHeading("Published image digests")
              .addTable([["Image", "Immutable reference"], ...images])
              .write();

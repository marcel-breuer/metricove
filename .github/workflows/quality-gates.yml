name: Quality gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Conventional Commit pull request titles and commits
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const conventional = /^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$/i;
            const pullRequest = context.payload.pull_request;
            if (!conventional.test(pullRequest.title)) {
              throw new Error(`Pull request title must use Conventional Commits: ${pullRequest.title}`);
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const invalid = commits
              .map((item) => ({ sha: item.sha.slice(0, 7), subject: item.commit.message.split(/\r?\n/, 1)[0] }))
              .filter((item) => !conventional.test(item.subject));
            if (invalid.length > 0) {
              throw new Error(`Every commit must use Conventional Commits; invalid: ${invalid.map((item) => `${item.sha} ${item.subject}`).join('; ')}`);
            }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend test suite
        working-directory: apps/api
        run: composer test

      - name: Check PHP formatting
        working-directory: apps/api
        run: composer pint:check

      - name: Run PHP static analysis
        working-directory: apps/api
        run: composer analyse

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install frontend dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: apps/web
        run: bun test

      - name: Check Svelte and TypeScript
        working-directory: apps/web
        run: bun run check

      - name: Build frontend
        working-directory: apps/web
        run: bun run --bun build

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Audit locked PHP dependencies
        working-directory: apps/api
        run: composer audit --locked

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Audit locked frontend dependencies
        working-directory: apps/web
        run: bun audit --audit-level=high

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: metricove_test
          POSTGRES_USER: metricove_test
          POSTGRES_PASSWORD: metricove_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metricove_test -d metricove_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: metricove_test
      DB_USERNAME: metricove_test
      DB_PASSWORD: metricove_test_password
      DB_URL: ''
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare isolated PostgreSQL test database
        working-directory: apps/api
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run full backend suite against PostgreSQL
        working-directory: apps/api
        run: composer test

name: Docker Compose build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Validate Compose and build images
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:18080
      APP_PORT: '18080'
      DB_DATABASE: metricove_ci
      DB_USERNAME: metricove_ci
      DB_PASSWORD: metricove_ci_only_password
      COMPOSE_PROJECT_NAME: metricove-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Select deployment smoke checks
        id: checks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
            echo "backup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "Could not resolve the pull request base; running all deployment smoke checks."
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
            echo "backup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha"..."$GITHUB_SHA")"
          if grep -Eq '^(compose\.yaml|apps/api/Dockerfile|apps/web/Dockerfile|docker/gateway/Dockerfile|apps/api/database/migrations/.*|apps/api/app/Http/Controllers/Api/InitialSetupController\.php|apps/api/app/Services/Setup/.*|apps/api/app/Exceptions/SetupAlreadyCompleted\.php)$' <<< "$changed_files"; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(compose\.yaml|apps/api/Dockerfile|apps/web/Dockerfile|docker/gateway/Dockerfile|scripts/backup\.sh|scripts/restore-backup\.sh|apps/api/config/filesystems\.php|apps/api/config/backup\.php|apps/api/app/Services/Backup/.*)$' <<< "$changed_files"; then
            echo "backup=true" >> "$GITHUB_OUTPUT"
          else
            echo "backup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Set up QEMU for release image validation
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v4

      - name: Prepare base-commit source for rollback smoke
        id: baseline
        if: github.event_name == 'push' || steps.checks.outputs.upgrade == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          baseline_dir="$RUNNER_TEMP/metricove-baseline"
          mkdir -p "$baseline_dir"
          git archive "$base_sha" | tar -x -C "$baseline_dir"
          echo "path=$baseline_dir" >> "$GITHUB_OUTPUT"

      - name: Build base-commit images
        if: steps.baseline.outputs.path != ''
        env:
          BASELINE_DIR: ${{ steps.baseline.outputs.path }}
        run: APP_IMAGE_TAG=baseline docker compose --file "$BASELINE_DIR/compose.yaml" --env-file "$BASELINE_DIR/.env.example" build --parallel

      - name: Build candidate application images
        run: APP_IMAGE_TAG=candidate docker compose --env-file .env.example build --parallel

      - name: Validate release images for AMD64 and ARM64 without publishing
        if: github.event_name == 'push'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --file apps/api/Dockerfile --target runtime --output "type=oci,dest=$RUNNER_TEMP/metricove-api.oci.tar" .
          docker buildx build --platform linux/amd64,linux/arm64 --file apps/web/Dockerfile --target runtime --output "type=oci,dest=$RUNNER_TEMP/metricove-web.oci.tar" .
          docker buildx build --platform linux/amd64,linux/arm64 --file docker/gateway/Dockerfile --target runtime --output "type=oci,dest=$RUNNER_TEMP/metricove-gateway.oci.tar" .

      - name: Verify upgrade, health, data persistence and rollback
        if: github.event_name == 'push' || steps.checks.outputs.upgrade == 'true'
        run: scripts/smoke-compose-upgrade-rollback.sh

      - name: Verify PostgreSQL and app_storage backup and restore
        if: github.event_name == 'push' || steps.checks.outputs.backup == 'true'
        env:
          APP_IMAGE_TAG: candidate
          BUILD_IMAGES: '0'
        run: scripts/smoke-compose-backup-restore.sh

      - name: Stop Compose stack and remove CI volumes
        if: always()
        run: APP_IMAGE_TAG=candidate docker compose --env-file .env.example down --timeout 15 --volumes --remove-orphans

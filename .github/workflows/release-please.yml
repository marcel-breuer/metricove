name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metricove-release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR or publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Require a workflow-capable release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN_METRICOVE }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error title=Missing release token::Add the RELEASE_PLEASE_TOKEN_METRICOVE repository Actions secret. See docs/releases.md."
            exit 1
          fi

      - name: Require successful CI for this main commit
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            if (context.ref !== "refs/heads/main") {
              throw new Error(`Release automation must run on main, not ${context.ref}.`);
            }

            const workflows = ["quality-gates.yml", "compose-build.yml"];
            const deadline = Date.now() + 55 * 60 * 1000;

            while (true) {
              const pending = [];

              for (const workflow_id of workflows) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  branch: "main",
                  event: "push",
                  head_sha: process.env.EXPECTED_SHA,
                  per_page: 100,
                });
                const run = data.workflow_runs
                  .filter((item) => item.head_sha === process.env.EXPECTED_SHA
                    && item.head_branch === "main"
                    && item.event === "push")
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

                if (!run || run.status !== "completed") {
                  pending.push(workflow_id);
                  continue;
                }
                if (run.conclusion !== "success") {
                  throw new Error(`${workflow_id} run ${run.html_url} finished with ${run.conclusion}.`);
                }

                core.info(`${workflow_id} run ${run.run_number} passed for ${process.env.EXPECTED_SHA}.`);
              }

              if (pending.length === 0) return;
              if (Date.now() >= deadline) {
                throw new Error(`Timed out waiting for successful CI on ${process.env.EXPECTED_SHA}: ${pending.join(", ")}.`);
              }

              core.info(`Waiting for ${pending.join(", ")} on ${process.env.EXPECTED_SHA}.`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

      - name: Create or update the release PR and publish merged releases
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN_METRICOVE }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge the release PR after all release checks pass
        uses: actions/github-script@v9
        env:
          RELEASE_PLEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN_METRICOVE }}
          script: |
            const pullRequests = JSON.parse(process.env.RELEASE_PLEASE_PRS || "[]");
            const releasePr = pullRequests.find((item) => item.baseBranchName === "main");
            if (!releasePr) {
              core.info("Release Please did not create or update a release PR.");
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: releasePr.number,
            });
            const expectedSha = pullRequest.head.sha;

            const workflows = ["quality-gates.yml", "compose-build.yml"];
            const deadline = Date.now() + 55 * 60 * 1000;

            while (true) {
              const pending = [];

              for (const workflow_id of workflows) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  head_sha: expectedSha,
                  event: "pull_request",
                  per_page: 100,
                });
                const run = data.workflow_runs
                  .filter((item) => item.head_sha === expectedSha && item.event === "pull_request")
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

                if (!run || run.status !== "completed") {
                  pending.push(workflow_id);
                  continue;
                }
                if (run.conclusion !== "success") {
                  throw new Error(`${workflow_id} run ${run.html_url} finished with ${run.conclusion}; the release PR will remain open.`);
                }

                core.info(`${workflow_id} run ${run.run_number} passed for ${expectedSha}.`);
              }

              if (pending.length === 0) break;
              if (Date.now() >= deadline) {
                throw new Error(`Timed out waiting for release PR checks: ${pending.join(", ")}.`);
              }

              core.info(`Waiting for ${pending.join(", ")} on release PR #${releasePr.number} at ${expectedSha}.`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: releasePr.number,
            });
            if (currentPullRequest.head.sha !== expectedSha) {
              throw new Error(`Release PR #${releasePr.number} changed from ${expectedSha} to ${currentPullRequest.head.sha}; leaving it open for checks on the new head.`);
            }

            const mergeResult = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: releasePr.number,
              sha: expectedSha,
              merge_method: "merge",
            });
            if (!mergeResult.data.merged) {
              throw new Error(`GitHub did not merge release PR #${releasePr.number}: ${mergeResult.data.message}`);
            }
            core.info(`Merged release PR #${releasePr.number} at ${mergeResult.data.sha} after all checks passed for ${expectedSha}.`);

# Weekly dependency checks for application, container and workflow manifests.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    assignees:
      - marcel-breuer

updates:
  - package-ecosystem: "composer"
    directory: "/apps/api"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    assignees:
      - marcel-breuer
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/apps/web"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    assignees:
      - marcel-breuer
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    assignees:
      - marcel-breuer
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/docker/gateway"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    assignees:
      - marcel-breuer
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    assignees:
      - marcel-breuer
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
